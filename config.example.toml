# Скопируй этот файл в config.toml (при первом запуске это делается автоматически).
# После правок: трей → «Перечитать настройки».

[api]
# Любой OpenAI-совместимый API. По умолчанию — Groq (быстрый, есть бесплатный тариф).
base_url = "https://api.groq.com/openai/v1"
api_key = ""          # или переменная окружения TEXTFIXER_API_KEY
model = "openai/gpt-oss-120b"
# Для «думающих» моделей (gpt-oss): low = быстрее. Пусто — параметр не отправляется.
reasoning_effort = "low"
timeout_s = 8
max_chars = 4000      # длиннее не отправляем

[hotkeys]
# Модификаторы: ctrl, shift, alt, win. Клавиши: a-z, 0-9, f1-f24, space, enter, pause, ...
fix = "ctrl+shift+space"            # раскладка + орфография через ИИ
fix_and_send = "ctrl+shift+enter"   # то же самое и сразу Enter
layout = "pause"                    # только раскладка, без ИИ (мгновенно)

[auto_enter]
# В этих приложениях Enter сначала исправляет раскладку, потом отправляет.
# Shift+Enter (перенос строки) не трогается.
enabled = true
apps = ["discord.exe", "telegram.exe"]

[timing]
select_delay_ms = 40         # пауза после Ctrl+A (Discord применяет выделение не сразу)
copy_timeout_ms = 400        # ожидание Ctrl+C для горячих клавиш
enter_copy_timeout_ms = 150  # ожидание Ctrl+C при Enter (пустое поле = столько задержки)
paste_settle_ms = 80         # пауза после вставки перед Enter
clipboard_restore_ms = 400   # через сколько вернуть старое содержимое буфера

[style]
active = "my"   # меняется из трея (меню «Стиль»)

# Стили: можно править тексты и добавлять свои ([styles.<id>]).
# В промпт всегда добавляются общие правила: не переводить, не отвечать на сообщение,
# сохранять ссылки, @упоминания, эмодзи и переносы строк.
#   rewrite = true            — стиль переписывает текст (разрешает менять длину)
#   strip_final_period = true — код убирает точку в конце сообщения (модель иногда её ставит)

[styles.my]
name = "Мой стиль"
rewrite = false
strip_final_period = true
prompt = """
Исправь только орфографию, грамматику, запятые и заглавные буквы.
Сохрани мои формулировки, сленг, тон и порядок слов. Не перефразируй, не сокращай и не дополняй.
Каждое предложение начинай с заглавной буквы.
В конце последнего предложения точку не ставь.
Если всё уже правильно, верни текст без изменений.
"""

[styles.business]
name = "Деловой"
rewrite = true
strip_final_period = false
prompt = """
Перепиши сообщение в вежливом, ясном деловом стиле — для рабочей переписки с коллегами или клиентами.
Полные предложения, правильная пунктуация, без сленга, слов-паразитов и мата.
Сохрани смысл и все факты. Не добавляй приветствий, подписей и деталей, которых нет в исходнике.
Длина — примерно как у исходного сообщения.
"""
